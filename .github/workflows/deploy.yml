# Optional: deploy automatically on every push to main.
# Repo secrets needed: VPS_HOST, VPS_USER, VPS_SSH_KEY (private key of a deploy user on the VPS).
name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Run deploy script on the VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: cd /root/apps/myrgp-site && ./scripts/deploy.sh

      - name: Check the live site
        run: |
          sleep 5
          curl -fsS -o /dev/null -w "myrgp.in HTTP %{http_code}\n" https://myrgp.in/
          curl -fsS -o /dev/null -w "ta.html HTTP %{http_code}\n" https://myrgp.in/ta.html
